
[blockchain_a]
  docker_cmd_params = ["-b", "1"]
  type = "anvil"

  [blockchain_a.resources]
    cpus = 1
    memory_mb = 1048

[data_provider]
  port = 9111

[[nodesets]]
  nodes = 5
  override_mode = "all"

  [nodesets.db]
    image = "postgres:12.0"

    [nodesets.db.resources]
      cpus = 1
      memory_mb = 1048

  [[nodesets.node_specs]]

    [nodesets.node_specs.node]
      image = "public.ecr.aws/chainlink/chainlink:2.49.1-rc.2"

      [nodesets.node_specs.node.resources]
        cpus = 1
        memory_mb = 1048
